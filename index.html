<!DOCTYPE html>
<html lang="ko">

<meta property="og:type" content="website">
<meta property="og:site_name" content="안녕하시렵니까 길드 포털">

<meta property="og:description" content="RF 온라인 넥스트 — 길드원 명단, 캐릭터 장비, 스킬·마유, 워게임 편성, 경매 현황을 한곳에서 관리합니다.">
<meta property="og:url" content="https://geruvim-eno.github.io/annyeong/">
<meta name="theme-color" content="#3BD6E8">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="안녕하시렵니까 길드 포털">
<meta name="twitter:description" content="RF 온라인 넥스트 — 길드 운영 통합 관리">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230A0F1C'/%3E%3Ctext y='68' x='50' font-size='54' text-anchor='middle' fill='%23F5A524' font-family='sans-serif' font-weight='bold'%3E防%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0F1C; --panel:rgba(17,26,44,.88); --panel2:rgba(13,21,36,.9); --line:#1E2A42;
  --txt:#E8EFF9; --mut:#8496B0; --cyan:#3BD6E8; --amber:#F5A524;
  --red:#FF5D6C; --green:#4ADE80; --gold:#FFD166;
  --bellato:#3B82F6; --cora:#A855F7; --accretia:#EF4444;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
/* ---- RF풍 우주 배경 (자체 제작, 40% 투명도) ---- */
#space{position:fixed;inset:0;z-index:-1;opacity:.4;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 75% 15%, rgba(168,85,247,.45), transparent 60%),
    radial-gradient(ellipse 50% 35% at 15% 70%, rgba(59,130,246,.4), transparent 60%),
    radial-gradient(ellipse 45% 30% at 60% 85%, rgba(239,68,68,.3), transparent 65%),
    radial-gradient(ellipse 80% 60% at 40% 40%, rgba(59,214,232,.12), transparent 70%),
    #060A14;}
#stars{position:fixed;inset:0;z-index:-1;opacity:.4;pointer-events:none}
.num{font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:.02em}
.tri{height:3px;background:linear-gradient(90deg,var(--bellato),var(--cora),var(--accretia))}
header{position:sticky;top:0;z-index:50;background:rgba(10,15,28,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:'Rajdhani';font-weight:700;font-size:21px;letter-spacing:.06em}
.logo b{color:var(--cyan)}
.logo small{display:block;font-size:10px;color:var(--mut);letter-spacing:.25em;font-weight:600}
.hbtns{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.src{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.dot.live{background:var(--green);box-shadow:0 0 8px var(--green)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 14px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.primary{background:var(--cyan);color:#04222A;border-color:var(--cyan);font-weight:700}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{border-color:rgba(255,93,108,.5);color:var(--red)}
.btn.edit-on{background:var(--amber);color:#3A2600;border-color:var(--amber);font-weight:700}
.stats{display:flex;gap:8px;flex-wrap:nowrap;width:100%;overflow-x:auto;padding-bottom:2px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 13px;min-width:100px;flex:0 0 auto}
.stat .v{font-family:'Rajdhani';font-size:20px;font-weight:700;color:var(--cyan)}
.stat .l{font-size:11px;color:var(--mut);white-space:nowrap}
nav{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:none;color:var(--mut);font:inherit;font-weight:500;padding:11px 15px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button:hover{color:var(--txt)}
nav button.on{color:var(--cyan);border-bottom-color:var(--cyan);font-weight:700}
main{max-width:1280px;margin:0 auto;padding:18px 20px}
section{display:none}section.on{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;backdrop-filter:blur(4px)}
h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2::before{content:"";width:4px;height:15px;background:var(--cyan);border-radius:2px;flex:0 0 auto}
h2 .sub{font-size:12px;color:var(--mut);font-weight:400}
h2 .right{margin-left:auto;display:flex;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{color:var(--mut);font-size:12px;font-weight:700;background:#0D1524;box-shadow:0 1px 0 var(--line)}
/* 좌측 고정: 위치·순위·캐릭명 */
.tblwrap.frz td:nth-child(-n+3),.tblwrap.frz th:nth-child(-n+3){position:sticky;background:#0D1524;z-index:3}
.tblwrap.frz td:nth-child(1),.tblwrap.frz th:nth-child(1){left:0}
.tblwrap.frz td:nth-child(2),.tblwrap.frz th:nth-child(2){left:var(--c1,58px)}
.tblwrap.frz td:nth-child(3),.tblwrap.frz th:nth-child(3){left:var(--c2,110px)}
.tblwrap.frz tr:hover td:nth-child(-n+3){background:#122036}
/* 화면 상단에 떠서 따라오는 헤더 */
.floathdr{position:fixed;z-index:40;display:none;overflow:hidden;border-bottom:1px solid var(--cyan);
  box-shadow:0 6px 16px rgba(0,0,0,.5);background:#0D1524;border-radius:0}
.floathdr-in{overflow-x:scroll;scrollbar-width:none;-ms-overflow-style:none}
.floathdr-in::-webkit-scrollbar{display:none}
.floathdr table{border-collapse:collapse;table-layout:fixed}
.floathdr th{padding:7px 9px;text-align:left;white-space:nowrap;cursor:pointer;font-size:12px}
.floathdr-in.frz th:nth-child(-n+3){position:sticky;background:#0D1524;z-index:3}
.floathdr-in.frz th:nth-child(1){left:0}
.floathdr-in.frz th:nth-child(2){left:var(--c1,58px)}
.floathdr-in.frz th:nth-child(3){left:var(--c2,110px)}
/* 그룹 구분 라벨 */
.grouplbl{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-weight:700;font-size:14px}
.grouplbl .ln{flex:1;height:1px;background:var(--line)}
.grouplbl.in{color:var(--cyan)}
.grouplbl.out{color:var(--amber)}
.draghandle{cursor:grab;font-size:15px;user-select:none;color:var(--mut);display:inline-block;padding:2px 4px}
.draghandle:hover{color:var(--cyan)}
tr.dragging{opacity:.35}
tr.rowdragover td{box-shadow:inset 0 2px 0 var(--cyan)}
/* 자유 시트 */
.freesheet{border-collapse:collapse}
.freesheet td{border:1px solid var(--line);min-width:90px;height:34px;padding:0;position:relative}
.freesheet td .fscell{width:100%;height:100%;padding:6px 8px;font-size:13px;color:var(--txt);
  outline:none;white-space:pre-wrap;word-break:break-word;cursor:text}
.freesheet td .fscell:empty:before{content:'';}
body.editing .freesheet td:hover{outline:1px solid var(--cyan);outline-offset:-1px}
.freesheet .rowhead,.freesheet .colhead{background:var(--panel2);color:var(--mut);font-size:11px;
  text-align:center;min-width:32px;width:32px;user-select:none}
/* 공대 편성 */
.ptbl{width:100%;border-collapse:collapse;table-layout:fixed}
.ptbl th,.ptbl td{border:1px solid var(--line);padding:7px 6px;text-align:center;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptbl .rolerow th{font-weight:700;font-size:12px}
.ptbl .teamrow th{background:#1D3A5C;color:#CFE6FF;font-weight:700}
.ptbl .side{background:#152238;color:var(--txt);font-weight:700;width:64px}
.ptbl td.mem{background:rgba(255,255,255,.02)}
.ptbl td.mem.dup{background:rgba(255,93,108,.16);color:#FFB3BA}
.ptbl td.mem.empty{color:#3A4966}
body.editing .ptbl td.mem,body.editing .ptbl th.role,body.editing .ptbl th.tname{cursor:pointer}
body.editing .ptbl td.mem:hover,body.editing .ptbl th.role:hover,body.editing .ptbl th.tname:hover{outline:1px dashed var(--amber);outline-offset:-1px}
.role-g{background:rgba(74,222,128,.18);color:#B6F0C8}
.role-p{background:rgba(236,72,153,.18);color:#F8C0DC}
.role-v{background:rgba(168,85,247,.20);color:#DCC8F8}
.role-b{background:rgba(59,130,246,.18);color:#BBD6FF}
.role-a{background:rgba(245,165,36,.18);color:#F8DCA8}
.pwrap{overflow-x:auto}
.pcount{font-size:12px;color:var(--mut);margin-top:6px}
.doc{max-width:900px}
.doc h3{font-size:15px;color:var(--cyan);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.doc h3:first-child{margin-top:0}
.doc h4{font-size:13.5px;color:var(--txt);margin:14px 0 6px}
.doc p,.doc li{font-size:13.5px;line-height:1.85;color:var(--txt)}
.doc ul,.doc ol{margin:6px 0 10px 20px}
.doc li{margin:3px 0}
.doc .step{display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.doc .step b{flex:0 0 26px;height:26px;line-height:26px;text-align:center;border-radius:50%;
  background:var(--cyan);color:#04222A;font-family:'Rajdhani';font-size:14px}
.doc .kbd{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;
  padding:1px 7px;font-family:'Rajdhani';font-weight:700;font-size:13px;color:var(--cyan)}
.doc .tip{border-left:3px solid var(--green);background:rgba(74,222,128,.07);padding:9px 13px;border-radius:0 8px 8px 0;margin:10px 0}
.doc .warn{border-left:3px solid var(--red);background:rgba(255,93,108,.07);padding:9px 13px;border-radius:0 8px 8px 0;margin:10px 0}
.doc table{margin:8px 0}
.doc td,.doc th{white-space:normal}
/* 상단 채널 아이콘 */
.chicons{display:flex;gap:12px;align-items:flex-start;margin-left:auto;padding:2px 0}
.chicons a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;transition:.15s}
.chicons a:hover{transform:translateY(-2px);filter:brightness(1.08)}
.chicons svg{display:block;border-radius:13px;box-shadow:0 3px 12px rgba(0,0,0,.5)}
.chicons .pw{font-size:11px;color:var(--amber);font-weight:700;white-space:nowrap}
.chicons .cap{font-size:11px;color:var(--mut);white-space:nowrap}
@media(max-width:640px){.chicons{margin-left:0}.chicons svg{width:42px;height:42px}}
.linkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.linkbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:9px;
  text-decoration:none;font-weight:700;font-size:13.5px;border:1px solid transparent;transition:.15s}
.linkbtn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.linkbtn.kakao{background:#FEE500;color:#191600}
.linkbtn.discord{background:#5865F2;color:#fff}
.linkbtn .ic{font-size:15px}
/* ===== 캡처 모달 ===== */
.capov{position:fixed;inset:0;background:rgba(4,7,14,.86);z-index:200;display:none;
  align-items:center;justify-content:center;padding:20px;overflow:auto}
.capbox{background:#0B1220;border:1px solid #3BD6E8;border-radius:14px;padding:20px 22px;
  max-width:min(96vw,1100px);max-height:92vh;display:flex;flex-direction:column;gap:10px}
.caphd{font-size:19px;font-weight:800;color:#EAF2FF}
.capsub{font-size:12.5px;color:#8FA6C4}
.capimg{overflow:auto;border-radius:10px;background:#0C1220;flex:1;min-height:0}
.capimg img{display:block;max-width:100%;height:auto}
.capbtns{display:flex;gap:10px;align-items:center}
@media(max-width:640px){.capbox{padding:14px}.caphd{font-size:16px}}
/* 캡처 대상: 불투명 색만 사용 */
.capwrap{display:inline-block;background:#0C1220;padding:20px 22px 16px;border-radius:12px;
  border-top:5px solid #3B82F6;font-family:"Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;min-width:520px}
.caphead{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.caphead .capt{font-size:24px;font-weight:800;color:#FFFFFF}
.caphead .capmeta{font-size:13px;color:#8FA6C4}
.captbl{border-collapse:collapse;width:100%}
.captbl th,.captbl td{border:1px solid #35507A;padding:9px 14px;text-align:center;
  font-size:15px;white-space:nowrap;color:#EAF2FF}
.captbl thead th{font-weight:700;font-size:14px}
.captbl th.tm{background:#1D3A5C;color:#CFE6FF}
.captbl td{background:#111A2C}
.captbl tbody tr:nth-child(even) td{background:#0E1728}
.captbl td.em{color:#54657F}
.capnh{margin:16px 0 8px;font-size:15px;font-weight:700;color:#7FE6F5}
.cnote{background:#111C2F;border:1px solid #31496E;border-radius:9px;padding:10px 12px;margin-bottom:8px}
.cnote .clab{display:inline-block;padding:2px 10px;border-radius:5px;font-size:13px;font-weight:700}
.cnote .ctm{font-size:12px;color:#8FA6C4;margin-left:8px}
.cnote .ctx{font-size:14px;color:#E8EFF9;line-height:1.7;margin-top:6px}
.capfoot{margin-top:12px;font-size:11px;color:#5A6E8C;letter-spacing:.08em}
.ptbl .titlerow th{background:#0F2743;color:var(--cyan);font-size:14px;font-weight:700;letter-spacing:.05em;padding:9px}
.pflex{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pflex .pleft{flex:1 1 460px;min-width:0}
.pflex .pright{flex:0 1 300px;min-width:240px}
.notecard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.notecard .nh{font-weight:700;font-size:12px;margin-bottom:5px;display:inline-block;padding:2px 8px;border-radius:4px}
.notecard .nb{font-size:12.5px;color:var(--txt);line-height:1.65;white-space:pre-wrap;min-height:20px}
.notecard .nb.empty{color:#4A5B75}
body.editing .notecard .nb{cursor:pointer}
body.editing .notecard .nb:hover{outline:1px dashed var(--amber);outline-offset:2px;border-radius:4px}
.notecard textarea{width:100%;min-height:86px;background:#16233A;border:1px solid var(--amber);border-radius:6px;color:var(--txt);padding:8px;font:inherit;font-size:12.5px;line-height:1.6;outline:none;resize:vertical}
@media(max-width:760px){.pflex .pright{flex:1 1 100%}}
/* 추첨 돌림판 */
.wheelwrap{max-width:460px;margin:0 auto}
.wheelwrap canvas{width:100%;height:auto;display:block}
.drawres{list-style:none;display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto}
.drawres li{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:500}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--cyan)}
th .arr{opacity:.5;font-size:10px}
tr:hover td{background:rgba(59,214,232,.04)}
.center{text-align:center}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;-webkit-overflow-scrolling:touch}
.search{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.search input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:9px 14px;font:inherit;width:240px;outline:none;max-width:100%}
.search input:focus{border-color:var(--cyan)}
.hint{font-size:12px;color:var(--mut)}
.rank{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:2px 6px;font-family:'Rajdhani';font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.rank.r1{background:var(--gold);color:#3A2E00;border-color:var(--gold)}
.rank.r2{background:#C7D2E4;color:#1F2A3D;border-color:#C7D2E4}
.rank.r3{background:#C98A5B;color:#2E1A0A;border-color:#C98A5B}
.pbar{position:relative;background:var(--panel2);border-radius:5px;height:20px;min-width:110px;overflow:hidden}
.pbar i{position:absolute;inset:0;background:linear-gradient(90deg,rgba(59,214,232,.15),rgba(59,214,232,.55));border-right:2px solid var(--cyan)}
.pbar span{position:relative;display:block;text-align:right;padding:0 8px;font-family:'Rajdhani';font-weight:700;font-size:14px;line-height:20px}
.ox{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;font-family:'Rajdhani';font-weight:700}
.ox.o{background:rgba(74,222,128,.15);color:var(--green);box-shadow:inset 0 0 0 1px rgba(74,222,128,.4)}
.ox.x{background:rgba(132,150,176,.08);color:#5A6B85}
.ox.t{background:rgba(245,165,36,.15);color:var(--amber);font-size:10px;padding:0 6px}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge.must{background:rgba(74,222,128,.12);color:var(--green)}
.badge.free{background:rgba(132,150,176,.12);color:var(--mut)}
.badge.no{background:rgba(255,93,108,.12);color:var(--red)}
.badge.yes{background:rgba(59,214,232,.12);color:var(--cyan)}
.pen{color:var(--red);font-family:'Rajdhani';font-weight:700}
.rules{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:16px;white-space:pre-wrap;font-size:13px;line-height:1.9}
.rules b{color:var(--amber)}
.rules[contenteditable]{border-color:var(--amber);min-height:320px;outline:none}
.rules ul,.rules ol{margin:6px 0 6px 22px;padding-left:6px}
.rules li{margin:3px 0;line-height:1.75}
.rules ul{list-style:disc}
.rules ul ul{list-style:circle}
.rules ol{list-style:decimal}
.rtb{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.rtb button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.rtb button:hover{border-color:var(--cyan)}
.rtb .sep{width:1px;background:var(--line);margin:0 3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px}
.chip.main{border-color:rgba(255,209,102,.5);color:var(--gold)}
.chip .del{color:var(--red);margin-left:6px;cursor:pointer;font-weight:700}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.calc input{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--cyan);padding:5px 8px;font-family:'Rajdhani';font-weight:600;width:88px;text-align:right;outline:none}
.calc input:focus{border-color:var(--cyan)}
.calc .res{color:var(--cyan);font-family:'Rajdhani';font-weight:700;font-size:15px}
.note{font-size:12px;color:var(--mut);margin-top:8px}
footer{max-width:1280px;margin:0 auto;padding:16px 20px 40px;color:var(--mut);font-size:12px;border-top:1px solid var(--line)}
/* ---- 수정 모드 ---- */

      });

        if(t.note&&!nt[lab])nt[lab]=t.note;

/* ===== 3-way 병합: 시트 최신본 + 내 변경분 ===== */
function tagBi(d){['basic','skills','mau'].forEach(k=>{(d[k]||[]).forEach((o,i)=>{o._bi=i;});});return d;}
function stripBi(d){['basic','skills','mau'].forEach(k=>{(d[k]||[]).forEach(o=>{delete o._bi;});});return d;}
function mergeData(fresh,base,edit){
  const out=JSON.parse(JSON.stringify(fresh));
  const FIELDS={basic:['name','power','loc'],skills:['name','loc'],mau:['name','memo']};
  const ARR={basic:'eq',skills:'vals'};
  ['basic','skills','mau'].forEach(k=>{
    const bL=base[k]||[],eL=edit[k]||[];const rL=out[k]=out[k]||[];
    // 포털에서 삭제한 항목 → 시트 최신본에서도 제거
    const kept=new Set(eL.filter(o=>o._bi>=0).map(o=>o._bi));
    bL.forEach((b,i)=>{if(!kept.has(i)){const j=rL.findIndex(r=>r.name===b.name);if(j>-1)rL.splice(j,1);}});
    // 포털에서 변경/추가한 항목 → 필드 단위로 시트 최신본 위에 적용
    eL.forEach(e=>{
      if(e._bi>=0&&bL[e._bi]){
        const b=bL[e._bi];const ch={};let any=false;
        FIELDS[k].forEach(f=>{if(JSON.stringify(e[f])!==JSON.stringify(b[f])){ch[f]=e[f];any=true;}});
        const ak=ARR[k];const arrCh=[];
        if(ak)(e[ak]||[]).forEach((v,i2)=>{if(JSON.stringify(v)!==JSON.stringify((b[ak]||[])[i2])){arrCh.push([i2,v]);any=true;}});
        if(!any)return; // 내가 안 고친 항목 → 시트값 그대로 유지
        let r=rL.find(x=>x.name===b.name);
        if(!r){r=JSON.parse(JSON.stringify(e));delete r._bi;rL.push(r);return;} // 시트에서 사라졌으면 내 버전 추가
        Object.assign(r,ch);
        if(ak){r[ak]=r[ak]||[];arrCh.forEach(p=>{r[ak][p[0]]=p[1];});}
      }else{const r=JSON.parse(JSON.stringify(e));delete r._bi;rL.push(r);} // 신규 추가
    });
  });
  out.notice=JSON.parse(JSON.stringify(edit.notice||base.notice)); // 공지는 포털 전용
  out.freeSheet=JSON.parse(JSON.stringify(edit.freeSheet||base.freeSheet||fresh.freeSheet||SNAP.freeSheet));
  out.parties=JSON.parse(JSON.stringify(edit.parties||base.parties||fresh.parties));
  out.tabsHidden=(edit.tabsHidden||base.tabsHidden||[]).slice();
  out.rosterCols=JSON.parse(JSON.stringify(edit.rosterCols||base.rosterCols||{talk:true,notice:true}));
  out.tabPerm=JSON.parse(JSON.stringify(edit.tabPerm||base.tabPerm||SNAP.tabPerm));
  out.links=JSON.parse(JSON.stringify(edit.links||base.links||SNAP.links));
  out.auctionPrices=JSON.parse(JSON.stringify(edit.auctionPrices||base.auctionPrices||SNAP.auctionPrices));
  out.guildName=edit.guildName||base.guildName||fresh.guildName||'안녕하시렵니까';
  out.subTitle=edit.subTitle||base.subTitle||fresh.subTitle||'RF ONLINE NEXT';
  out.basicHeaders=edit.basicHeaders;out.skillHeaders=edit.skillHeaders;
  return out;
}

/* ===== 구글 시트 동기화 (Apps Script) ===== */
async function remoteAuth(pw){
  if(!SYNC_URL)return false;
  try{
    const r=await fetch(SYNC_URL,{method:'POST',body:JSON.stringify({action:'auth',pw})});
    const j=await r.json();
    if(j&&j.ok&&j.token){authToken=j.token;role=j.role;return true;}
    return false;
  }catch(e){return false;}
}
async function remoteLoad(){
  if(!SYNC_URL||!authToken)return null;
  try{const r=await fetch(SYNC_URL,{method:'POST',body:JSON.stringify({action:'load',token:authToken}),signal:AbortSignal.timeout(9000)});
    const j=await r.json();return j&&j.data?j.data:null;}catch(e){return null;}
}
async function remoteSave(data){
  if(!SYNC_URL)return null; // 미설정
  if(!authToken)return 'err:인증이 만료되었습니다. 수정 모드를 다시 시작하세요';
  try{const r=await fetch(SYNC_URL,{method:'POST',body:JSON.stringify({token:authToken,data})});
    const j=await r.json();
    if(j&&j.ok)return true;
    if(j&&(j.err==='bad_pw'||j.err==='bad_token'))return 'pw';
    return 'err:'+((j&&j.err)||'unknown');}catch(e){return 'err:'+e.message;}
}

const mBg=document.getElementById('modalBg'),mT=document.getElementById('mTitle'),mB=document.getElementById('mBody'),
      mPw=document.getElementById('mPw'),mErr=document.getElementById('mErr'),
      mOk=document.getElementById('mOk'),mCancel=document.getElementById('mCancel');
function modal({title,body,pw=false,okText='확인',onOk}){
  mT.textContent=title;mB.textContent=body;
  mPw.style.display=pw?'block':'none';mPw.value='';mErr.style.display='none';
  mOk.textContent=okText;mBg.classList.add('on');
  if(pw)setTimeout(()=>mPw.focus(),50);
  mOk.onclick=async()=>{
    if(pw){
      const v=mPw.value;
      mOk.disabled=true;mOk.textContent=T('확인 중…');
      const ok=await remoteAuth(v);
      mOk.disabled=false;mOk.textContent=okText;
      if(!ok){mErr.style.display='block';mPw.value='';mPw.focus();return;}
    }
    mBg.classList.remove('on');onOk&&onOk();
  };
  mCancel.onclick=()=>mBg.classList.remove('on');
  mPw.onkeydown=e=>{if(e.key==='Enter')mOk.click()};
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}

function editableCell(td,get,set){
  td.classList.add('editable');
  td.onclick=e=>{
    if(!curEditable)return;
    if(td.querySelector('input'))return;
    const old=get();
    const inp=document.createElement('input');inp.className='cellinp';inp.value=old==null?'':old;
    td.textContent='';td.appendChild(inp);inp.focus();inp.select();
    const done=commit=>{
      const v=inp.value.trim();
      td.removeChild(inp);
      if(commit&&v!==String(old==null?'':old)){set(v);setDirty(dirty+1);td.classList.add('dirty');}
      td.textContent=(get()==null||get()==='')?'—':get();
      if(td.dataset.num==='1'&&get()!=='')td.innerHTML=`<span class="num">${fmt(get())}</span>`;
    };
    inp.onblur=()=>done(true);
    inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape'){inp.value=String(old==null?'':old);inp.blur();}};
  };
}

}

function sortableTable(cols,rows,opts={}){
  let sortK=opts.defaultSort||null,dir=opts.defaultDir||-1,filter='';
  const wrap=document.createElement('div');
  if(opts.search!==false){
    const sd=document.createElement('div');sd.className='search';
    const inp=document.createElement('input');inp.placeholder=T('캐릭터명 검색…');
    inp.oninput=()=>{filter=inp.value.trim().toLowerCase();draw();};
    sd.appendChild(inp);
    const h=document.createElement('span');h.className='hint';h.textContent=T('열 제목 클릭 = 정렬');
    sd.appendChild(h);wrap.appendChild(sd);
  }
  const tw=document.createElement('div');tw.className='tblwrap';
  const table=document.createElement('table');tw.appendChild(table);wrap.appendChild(tw);
  function draw(){
    let data=rows().filter(r=>!filter||String(r.name||'').toLowerCase().includes(filter));
    const vis=cols.filter(c=>!c.hidden);
    if(sortK!=null){
      const col=cols.find(c=>c.k===sortK);
      if(col){
        data=[...data].sort((a,b)=>{
          let x=col.val?col.val(a):a[sortK],y=col.val?col.val(b):b[sortK];
          if(col.num){x=(x==null||x==='')?-Infinity:+x;y=(y==null||y==='')?-Infinity:+y;return (x-y)*dir;}
          return String(x||'').localeCompare(String(y||''),'ko')*dir;
        });
      }
    }
    table.innerHTML='<thead><tr>'+vis.map(c=>`<th class="sortable ${c.cls||''}" data-k="${c.k}">${c.label} <span class="arr">${sortK===c.k?(dir>0?'▲':'▼'):'⇅'}</span></th>`).join('')+'</tr></thead>';
    const tb=document.createElement('tbody');
    data.forEach((r,i)=>{
      const tr=document.createElement('tr');
      vis.forEach(c=>{
        const td=document.createElement('td');td.className=c.cls||'';
        c.cell(td,r,i);
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    table.appendChild(tb);
    table.querySelectorAll('th').forEach(th=>th.onclick=()=>{
      const k=th.dataset.k;
      if(sortK===k)dir*=-1;else{sortK=k;const cc=cols.find(c=>c.k===k);dir=(cc&&cc.num)?-1:1;}
      draw();
      if(typeof syncStick==='function')syncStick();
    });
  }
  draw();
  return wrap;
}

let locFilter={basic:'전체',skill:'전체',mau:'전체'};
let curEditable=false; // 현재 렌더 중인 탭의 편집 허용 여부
function locTabs(key,rerender){
  const wrap=document.createElement('div');wrap.className='search';
  wrap.style.marginBottom='10px';

    const b=document.createElement('button');b.className='btn'+(locFilter[key]===v?' primary':'');
    b.textContent=TV(v);b.onclick=()=>{locFilter[key]=v;rerender();};
    wrap.appendChild(b);
  });
  const info=document.createElement('span');info.className='hint';
  info.textContent=T('위치별 보기 · 순위는 그룹별로 1위부터 · 수정 모드에서 위치 칸 클릭 = 목록에서 선택');
  wrap.appendChild(info);
  return wrap;
}
// 위치는 캐릭터명 기준으로 장비/스킬 탭이 공유
// 위치 기준 = 공지 탭 길드원 명단 (장비·스킬·마유 탭은 이를 따라감)
const LOC_STATES=['내근','외근'];
function normLoc(v){return LOC_STATES.includes(v)?v:'내근';}
// 위치 칸 클릭 → 드롭다운(내근·외근)에서 선택
function locSelectCell(td,getLoc,apply){
  td.classList.add('editable');
  td.onclick=()=>{
    if(!curEditable)return;
    if(td.querySelector('select'))return;
    const old=normLoc(getLoc());
    const sel=document.createElement('select');sel.className='cellinp';
    LOC_STATES.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=TV(v);if(v===old)o.selected=true;sel.appendChild(o);});
    td.textContent='';td.appendChild(sel);sel.focus();
    let finished=false;
    const done=()=>{if(finished)return;finished=true;
      const v=sel.value;
      if(v!==old)apply(v);else td.innerHTML=locHTML(old);};
    sel.onchange=done;sel.onblur=done;
    sel.onkeydown=e=>{if(e.key==='Escape'){sel.value=old;sel.blur();}};
  };
}
function locOf(name,self){
  const r=(cur().notice&&cur().notice.roster||[]).find(x=>x[0]===name);
  if(r)return normLoc(r[5]);
  const b=cur().basic.find(x=>x.name===name);
  if(b&&b.loc)return normLoc(b.loc);
  return normLoc(self&&self.loc);
}
function setLoc(name,v,self){
  const r=(cur().notice&&cur().notice.roster||[]).find(x=>x[0]===name);
  if(r)r[5]=v; // 명단이 원본
  const b=cur().basic.find(x=>x.name===name);if(b)b.loc=v;
  const s=cur().skills.find(x=>x.name===name);if(s)s.loc=v;
  if(self)self.loc=v;
}
const LOC_COLOR={'내근':['rgba(59,214,232,.12)','var(--cyan)'],'외근':['rgba(245,165,36,.15)','var(--amber)']};
const locHTML=v=>{const g=normLoc(v),c=LOC_COLOR[g];
  return `<span class="badge" style="background:${c[0]};color:${c[1]}">${TV(g)}</span>`;};

/* ===== 편성표 캡처 창 (창을 띄우면 사용자가 스크린샷) ===== */
const CAP_PAL={'role-g':['#1E4630','#8BE0A8'],'role-p':['#4A2140','#F0AFD0'],
  'role-v':['#3A2560','#D4BCF5'],'role-b':['#1B3A66','#AECBFF'],'role-a':['#4A3413','#F5D398']};

// 편성표를 캔버스로 그려 이미지(dataURL) 반환
function renderPartyCanvas(key){
  const g=cur().parties[key];if(!g)return null;
  const teams=g.teams||[],roles=g.roles||[],notes=g.notes||{};
  const nC=teams.length;if(!nC)return null;
  const rowsN=Math.max(1,...teams.map(t=>(t.members||[]).length));
  const cv=document.createElement('canvas'),x=cv.getContext('2d');
  const FT=(s,b)=>`${b?'700 ':''}${s}px "Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif`;
  const PAD=26,CH=38,HEAD=62;

  x.font=FT(15);
  const colW=teams.map((t,i)=>{
    let w=x.measureText(t.name).width;
    w=Math.max(w,x.measureText(roles[i]||'').width);
    (t.members||[]).forEach(mm=>{if(mm)w=Math.max(w,x.measureText(mm).width);});
    return Math.ceil(Math.max(104,w+28));
  });
  const tableW=colW.reduce((a,b)=>a+b,0);

  const uniq=[];roles.slice(0,nC).forEach(r=>{const l=(r||'').trim();if(!uniq.includes(l))uniq.push(l);});
  const wrapT=(txt,maxW)=>{x.font=FT(14);const out=[];
    String(txt||'').split('\n').forEach(line=>{let c='';
      for(const ch of line){if(x.measureText(c+ch).width>maxW){out.push(c);c=ch;}else c+=ch;}out.push(c);});
    return out;};
  const blocks=uniq.map(lab=>{
    const txt=(notes[lab]||'').trim();if(!txt)return null;
    const tn=teams.filter((t,i)=>((roles[i]||'').trim())===lab).map(t=>t.name).join(', ');
    return {lab,tn,lines:wrapT(txt,tableW-40)};
  }).filter(Boolean);
  const notesH=blocks.length?36+blocks.reduce((a,b)=>a+34+b.lines.length*22+16,0):0;

  const W=tableW+PAD*2, H=HEAD+CH*(2+rowsN)+(notesH?18+notesH:0)+PAD+24;
  const S=2;cv.width=W*S;cv.height=H*S;x.scale(S,S);

  x.fillStyle='#0C1220';x.fillRect(0,0,W,H);
  ['#3B82F6','#A855F7','#EF4444'].forEach((c,i)=>{x.fillStyle=c;x.fillRect(W/3*i,0,W/3,5);});
  const d=new Date(),p2=n=>String(n).padStart(2,'0');
  x.fillStyle='#FFFFFF';x.font=FT(23,1);x.textBaseline='alphabetic';
  x.fillText(`${key} 편성`,PAD,HEAD-20);
  x.fillStyle='#8FA6C4';x.font=FT(13);x.textAlign='right';
  x.fillText(`${cur().guildName||''} · ${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())}`,W-PAD,HEAD-22);
  x.textAlign='left';

  const cell=(t,cx,cy,cw,col,bold,size)=>{x.fillStyle=col;x.font=FT(size||15,bold);
    x.textAlign='center';x.textBaseline='middle';x.fillText(t,cx+cw/2,cy+CH/2);x.textAlign='left';};
  let ty=HEAD,cx=PAD,i=0;
  while(i<nC){
    const lab=(roles[i]||'').trim();let sp=1;
    while(i+sp<nC&&((roles[i+sp]||'').trim())===lab)sp++;
    const w=colW.slice(i,i+sp).reduce((a,b)=>a+b,0);
    const pal=CAP_PAL[roleClass(lab)]||['#22314A','#CFE0F5'];
    x.fillStyle=pal[0];x.fillRect(cx,ty,w,CH);
    x.strokeStyle='#35507A';x.lineWidth=1;x.strokeRect(cx,ty,w,CH);
    cell(lab||'—',cx,ty,w,pal[1],1,14);cx+=w;i+=sp;
  }
  ty+=CH;cx=PAD;
  teams.forEach((t,ci)=>{x.fillStyle='#1D3A5C';x.fillRect(cx,ty,colW[ci],CH);
    x.strokeStyle='#35507A';x.strokeRect(cx,ty,colW[ci],CH);
    cell(t.name,cx,ty,colW[ci],'#CFE6FF',1,14);cx+=colW[ci];});
  ty+=CH;
  for(let r=0;r<rowsN;r++){
    cx=PAD;
    teams.forEach((t,ci)=>{const mm=(t.members||[])[r]||'';
      x.fillStyle=r%2?'#0E1728':'#111A2C';x.fillRect(cx,ty,colW[ci],CH);
      x.strokeStyle='#2C4A6A';x.strokeRect(cx,ty,colW[ci],CH);
      cell(mm||'—',cx,ty,colW[ci],mm?'#EAF2FF':'#54657F',0,15);cx+=colW[ci];});
    ty+=CH;
  }
  if(blocks.length){
    ty+=18;x.fillStyle='#7FE6F5';x.font=FT(16,1);x.textBaseline='alphabetic';
    x.fillText('플레이 방법',PAD,ty+4);ty+=22;
    blocks.forEach(b=>{
      const bh=34+b.lines.length*22+12;
      x.fillStyle='#111C2F';x.fillRect(PAD,ty,tableW,bh);
      x.strokeStyle='#31496E';x.strokeRect(PAD,ty,tableW,bh);
      const pal=CAP_PAL[roleClass(b.lab)]||['#22314A','#CFE0F5'];
      x.font=FT(13,1);const lw=x.measureText(b.lab||'—').width+18;
      x.fillStyle=pal[0];x.fillRect(PAD+11,ty+9,lw,22);
      x.fillStyle=pal[1];x.textBaseline='middle';x.fillText(b.lab||'—',PAD+20,ty+20);
      x.fillStyle='#8FA6C4';x.font=FT(12);x.fillText(b.tn,PAD+20+lw,ty+20);
      x.fillStyle='#E8EFF9';x.font=FT(14);
      b.lines.forEach((ln,li)=>x.fillText(ln,PAD+13,ty+46+li*22));
      ty+=bh+10;
    });
  }
  x.fillStyle='#5A6E8C';x.font=FT(11);x.textBaseline='alphabetic';
  x.fillText('RF ONLINE NEXT',PAD,H-12);
  return {canvas:cv,w:W,h:H};
}

function showCaptureModal(r,title,alt){
  const url=r.canvas.toDataURL('image/png');
  let ov=document.getElementById('capOverlay');
  if(!ov){ov=document.createElement('div');ov.id='capOverlay';ov.className='capov';document.body.appendChild(ov);}
  ov.innerHTML=`<div class="capbox">
      <div class="caphd">${escapeHTML(title)}</div>
      <div class="capsub">${r.w} × ${r.h} · 이미지를 길게 누르거나 오른쪽 클릭해 저장하세요.</div>
      <div class="capimg"><img id="capImg" src="${url}" alt="${escapeHTML(alt)}"></div>
      <div class="capbtns">
        <button class="btn primary" id="capCopy" style="flex:1">${T('이미지 복사')}</button>
        <button class="btn" id="capClose">${T('닫기')}</button>
      </div>
    </div>`;
  ov.style.display='flex';

  document.getElementById('capCopy').onclick=async()=>{
    const b=document.getElementById('capCopy');

      const blob=await new Promise(res=>r.canvas.toBlob(res,'image/png'));

      b.textContent=T('✅ 복사되었습니다');setTimeout(()=>b.textContent=T('이미지 복사'),1800);
    }catch(e){
      b.textContent=T('복사 미지원 — 우클릭 저장');setTimeout(()=>b.textContent=T('이미지 복사'),2200);
    }
  };
}

/* ===== 공대 편성 ===== */
const ROLE_COLORS={};
function roleClass(label0){
  const label=String(label0||'').replace(/\s*\d+$/,'').trim(); // 버프1/버프2 → 같은 색
  const p=['role-g','role-p','role-v','role-b','role-a'];
  if(!(label in ROLE_COLORS)){
    const used=Object.values(ROLE_COLORS);
    ROLE_COLORS[label]=p.find(c=>!used.includes(c))||p[used.length%p.length];
  }
  return ROLE_COLORS[label];
}
function memberPool(){
  const s=new Set();
  cur().basic.forEach(b=>s.add(b.name));
  (cur().notice.roster||[]).forEach(r=>s.add(r[0]));
  cur().skills.forEach(k=>s.add(k.name));
  return [...s].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ko'));
}
function renderParty(){
  const s=document.getElementById('sec-party');const E=can('party');curEditable=E;
  const P=cur().parties||{};
  s.innerHTML=Object.keys(P).map(k=>`
    <div class="panel"><h2>${TV(k)} ${T('편성')} <span class="sub" id="cnt-${k}"></span>
      <span class="right"><button class="btn" data-shot="${k}">${T('📷 캡처 화면')}</button>${E?`<button class="btn" data-addteam="${k}">${T('+ 공대')}</button><button class="btn" data-addrow="${k}">${T('+ 인원 줄')}</button>`:''}</span></h2>
      <div class="pflex" id="cap-${k}">
        <div class="pleft"><div class="pwrap"><table class="ptbl" id="pt-${k}"></table></div>
          <div class="pcount" id="dup-${k}"></div></div>
        <div class="pright" id="pn-${k}"></div>
      </div></div>`).join('');
  Object.keys(P).forEach(key=>{
    const grp=P[key],tb=document.getElementById('pt-'+key);
    const rows=Math.max(1,...grp.teams.map(t=>t.members.length));
    const seen={},dups=new Set();
    grp.teams.forEach(t=>t.members.forEach(m=>{if(!m)return;if(seen[m])dups.add(m);seen[m]=1;}));
    const nCols=grp.teams.length;
    let html='<colgroup>'+grp.teams.map(()=>'<col>').join('')+'</colgroup>';
    // 최상단 제목 행 (낙원 / 전장)
    html+=`<tr class="titlerow"><th colspan="${nCols}">${TV(key)}</th></tr>`;
    // 역할 행 (동일 역할 병합)
    html+='<tr class="rolerow">';
    for(let i=0;i<nCols;i++){
      const lab=grp.roles[i]||'';
      html+=`<th class="role ${roleClass(lab)}" data-k="${key}" data-i="${i}">${escapeHTML(TV(lab))||'—'}</th>`;
    }
    html+='</tr><tr class="teamrow">'+
      grp.teams.map((t,ti)=>`<th class="tname" data-k="${key}" data-t="${ti}">${escapeHTML(t.name)}</th>`).join('')+'</tr>';
    for(let r=0;r<rows;r++){
      html+='<tr>'+grp.teams.map((t,ti)=>{
        const m=t.members[r]||'';
        const cls='mem'+(m?(dups.has(m)?' dup':''):' empty');
        return `<td class="${cls}" data-k="${key}" data-t="${ti}" data-r="${r}">${m?escapeHTML(m):'—'}</td>`;
      }).join('')+'</tr>';
    }
    tb.innerHTML=html;
    const total=grp.teams.reduce((a,t)=>a+t.members.filter(Boolean).length,0);
    document.getElementById('cnt-'+key).textContent=LANG==='ko'?`${nCols}개 공대 · ${total}명`:`${nCols} parties · ${total} members`;
    const dl=document.getElementById('dup-'+key);
    dl.innerHTML=dups.size?`<span style="color:var(--red)">${T('⚠ 중복 배치')}: ${escapeHTML([...dups].join(', '))}</span>`:T('중복 배치 없음');

    // ---- 우측: 역할별 플레이 방법 (공대는 표기용) ----
    if(!grp.notes)grp.notes={};
    const uniq=[];grp.roles.slice(0,nCols).forEach(r0=>{const l=(r0||'').trim();if(!uniq.includes(l))uniq.push(l);});
    const pn=document.getElementById('pn-'+key);
    pn.innerHTML='<div class="pcount" style="margin:0 0 8px">'+T('플레이 방법')+'</div>'+uniq.map(lab=>{
      const teams=grp.teams.filter((t,ti)=>((grp.roles[ti]||'').trim())===lab).map(t=>t.name).join(', ');
      const txt=grp.notes[lab]||'';
      return `<div class="notecard"><span class="nh ${roleClass(lab)}">${escapeHTML(TV(lab))||'—'} <span style="opacity:.75;font-weight:400">${escapeHTML(teams)}</span></span>
        <div class="nb ${txt?'':'empty'}" data-k="${key}" data-lab="${lab}">${txt?escapeHTML(txt):(E?T('클릭해서 입력'):'—')}</div></div>`;
    }).join('');
    if(!E)return;
    // 메모 편집
    pn.querySelectorAll('.nb').forEach(nb=>{
      nb.onclick=()=>{
        if(nb.querySelector('textarea'))return;
        const k=nb.dataset.k,lab=nb.dataset.lab;
        const G=cur().parties[k];if(!G.notes)G.notes={};
        const old=G.notes[lab]||'';
        const ta=document.createElement('textarea');ta.value=old;
        ta.placeholder=T('예) 라인 유지 · 상대 진입 저지 · 버프 대기');
        nb.textContent='';nb.appendChild(ta);ta.focus();
        ta.onblur=()=>{const v=ta.value;
          if(v!==old){G.notes[lab]=v;setDirty(dirty+1);}
          renderParty();};
      };
    });
    // 인원 셀 → 드롭다운
    tb.querySelectorAll('td.mem').forEach(td=>{
      td.onclick=()=>{
        if(td.querySelector('select'))return;
        const k=td.dataset.k,ti=+td.dataset.t,r=+td.dataset.r;
        const t=cur().parties[k].teams[ti];const old=t.members[r]||'';
        const sel=document.createElement('select');sel.className='cellinp';
        const pool=memberPool();const opts=['',...pool];
        if(old&&!pool.includes(old))opts.splice(1,0,old);
        opts.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v===''?T('— 비움 —'):v;if(v===old)o.selected=true;sel.appendChild(o);});
        td.textContent='';td.appendChild(sel);sel.focus();
        const done=()=>{const v=sel.value;
          if(v!==old){t.members[r]=v;setDirty(dirty+1);}
          renderParty();};
        sel.onchange=done;sel.onblur=done;
      };
    });
    // 역할명 / 공대명 편집
    tb.querySelectorAll('th.role').forEach(th=>{
      th.onclick=()=>{const k=th.dataset.k,i0=+th.dataset.i;
        const g2=cur().parties[k];const old=g2.roles[i0]||'';
        const nv=prompt(g2.teams[i0].name+T(' 역할명 (같은 이름 중복 사용 가능)'),old);
        if(nv!==null&&nv.trim()!==old){
          const label=nv.trim();
          g2.roles[i0]=label;
          if(!g2.notes)g2.notes={};
          if(g2.notes[old]&&!g2.notes[label]&&!g2.roles.includes(old))
            {g2.notes[label]=g2.notes[old];delete g2.notes[old];}
          if(g2.notes[label]===undefined)g2.notes[label]='';
          setDirty(dirty+1);renderParty();}
      };
    });
    tb.querySelectorAll('th.tname').forEach(th=>{
      th.onclick=()=>{const k=th.dataset.k,ti=+th.dataset.t;
        const t=cur().parties[k].teams[ti];
        const nv=prompt(T('공대 이름 (빈칸 입력 시 이 공대 삭제)'),t.name);
        if(nv===null)return;
        if(nv.trim()===''){if(confirm(t.name+T(' 공대를 삭제할까요?'))){cur().parties[k].teams.splice(ti,1);cur().parties[k].roles.splice(ti,1);setDirty(dirty+1);renderParty();}return;}
        if(nv.trim()!==t.name){t.name=nv.trim();setDirty(dirty+1);renderParty();}
      };
    });
  });
  s.querySelectorAll('[data-shot]').forEach(b=>b.onclick=()=>openCapture(b.dataset.shot));
  s.querySelectorAll('[data-addteam]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.addteam,g=cur().parties[k];
    g.teams.push({name:(g.teams.length+1)+'공대',members:['']});
    g.roles.push(g.roles[g.roles.length-1]||'');
    setDirty(dirty+1);renderParty();});
  s.querySelectorAll('[data-addrow]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.addrow;cur().parties[k].teams.forEach(t=>t.members.push(''));
    setDirty(dirty+1);renderParty();});
}

    FS.forEach(row=>row.forEach((_,i)=>row[i]=''));setDirty(dirty+1);renderSheet();}};

/* ===== 추첨 (돌림판) — 서버 저장 없이 이 브라우저에만 보관 ===== */
const DRAW_KEY='guildDrawState';
const DRAW_COLORS=['#3B82F6','#A855F7','#EF4444','#F5A524','#22A06B','#0EA5B7','#EC4899','#6366F1'];
let drawState=(()=>{
  try{const s=JSON.parse(localStorage.getItem(DRAW_KEY)||'null');
    if(s&&Array.isArray(s.pool)&&Array.isArray(s.results))
      return Object.assign({added:[],removed:[],locs:drawAllLocs()},s);}catch(e){}
  return {pool:null,results:[],added:[],removed:[],locs:drawAllLocs()};
})();
function drawAllLocs(){return {'내근':true,'외근':true};}
let drawRot=0,drawSpinning=false;
function saveDraw(){try{localStorage.setItem(DRAW_KEY,JSON.stringify(drawState));}catch(e){}}
// 참가자 = 길드원 명단 중 선택한 위치(내근·외근) − 직접 뺀 이름 + 직접 추가한 이름
function drawCandidates(){
  const rm=new Set(drawState.removed),L=drawState.locs||drawAllLocs();
  const out=(cur().notice.roster||[]).filter(r=>r[0]&&L[normLoc(r[5])]!==false).map(r=>r[0]).filter(n=>!rm.has(n));
  drawState.added.forEach(n=>{if(!out.includes(n))out.push(n);});
  return out;
}
function addDrawName(raw){
  const nm=String(raw||'').trim();
  if(!nm||drawSpinning)return false;
  if(nm.length>20){toast(T('이름은 20자까지 입력할 수 있습니다'));return false;}
  if(drawPool().includes(nm)||drawState.results.includes(nm)){toast(T('이미 있는 이름입니다'));return false;}
  drawState.removed=drawState.removed.filter(x=>x!==nm);
  if(!drawCandidates().includes(nm))drawState.added.push(nm);
  if(drawState.results.length)drawState.pool.push(nm);else drawState.pool=drawCandidates();
  saveDraw();return true;
}
function removeDrawName(nm){
  if(drawSpinning)return;
  const pool=drawPool(),i=pool.indexOf(nm);if(i<0)return;
  pool.splice(i,1);
  if(drawState.added.includes(nm))drawState.added=drawState.added.filter(x=>x!==nm);
  else if(!drawState.removed.includes(nm))drawState.removed.push(nm);
  saveDraw();
}
// 아직 한 명도 뽑지 않았으면 명단 최신 상태로 다시 불러옴
function drawPool(){
  if(!drawState.results.length&&!drawSpinning)drawState.pool=drawCandidates();
  return drawState.pool||(drawState.pool=drawCandidates());
}
// 돌림판 그리기: i번째 칸 = [rot+i·seg, rot+(i+1)·seg], 화살표는 12시 방향
function paintWheel(cv,names,rot){
  const S=2,W=460,c=W/2,R=W/2-16;
  cv.width=W*S;cv.height=W*S;
  const x=cv.getContext('2d');x.scale(S,S);x.clearRect(0,0,W,W);
  const FT=(s,b)=>`${b?'700 ':''}${s}px "Noto Sans KR","Malgun Gothic",sans-serif`;
  x.textBaseline='middle';
  if(!names.length){
    x.fillStyle='#111A2C';x.beginPath();x.arc(c,c,R,0,Math.PI*2);x.fill();
    x.fillStyle='#8496B0';x.font=FT(20,1);x.textAlign='center';x.fillText(T('추첨 완료'),c,c);
    return;
  }
  const n=names.length,seg=Math.PI*2/n;
  const fs=Math.max(10,Math.min(18,Math.floor(seg*R*0.42)));
  names.forEach((nm,i)=>{
    const a0=rot+i*seg,a1=a0+seg;
    let col=DRAW_COLORS[i%DRAW_COLORS.length];
    if(n>1&&i===n-1&&i%DRAW_COLORS.length===0)col=DRAW_COLORS[1]; // 첫 칸과 같은 색이 이웃하지 않게
    x.beginPath();x.moveTo(c,c);x.arc(c,c,R,a0,a1);x.closePath();
    x.fillStyle=col;x.fill();
    if(n>1){x.strokeStyle='#0A0F1C';x.lineWidth=1.5;x.stroke();}
    // 왼쪽 절반은 글자가 뒤집히지 않도록 180° 돌려서 씀
    const mid=((a0+seg/2)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
    const flip=mid>Math.PI/2&&mid<Math.PI*1.5;
    x.save();x.translate(c,c);x.rotate(flip?mid+Math.PI:mid);
    x.fillStyle='#FFFFFF';x.font=FT(fs,1);x.textAlign=flip?'left':'right';
    x.fillText(nm,flip?-(R-12):R-12,0,R*0.66);
    x.restore();
  });
  x.beginPath();x.arc(c,c,R,0,Math.PI*2);x.strokeStyle='#3BD6E8';x.lineWidth=3;x.stroke();
  x.beginPath();x.arc(c,c,26,0,Math.PI*2);x.fillStyle='#0A0F1C';x.fill();x.strokeStyle='#3BD6E8';x.lineWidth=2;x.stroke();
  x.fillStyle='#FFD166';x.font=FT(13,1);x.textAlign='center';x.fillText(String(n),c,c);
  x.beginPath();x.moveTo(c-15,2);x.lineTo(c+15,2);x.lineTo(c,36);x.closePath();
  x.fillStyle='#FFD166';x.fill();x.strokeStyle='#3A2E00';x.lineWidth=2;x.stroke();
}
function drawWinnerIndex(n,rot){
  const TAU=Math.PI*2,seg=TAU/n;
  const a=(((Math.PI*1.5-rot)%TAU)+TAU)%TAU;
  return Math.min(n-1,Math.floor(a/seg));
}
function spinWheel(){
  const pool=drawPool();
  if(drawSpinning||!pool.length)return;
  drawSpinning=true;
  renderDraw(); // 도는 동안 버튼·참가자 편집 잠금
  const TAU=Math.PI*2,start=drawRot;
  const target=start+TAU*(5+Math.floor(Math.random()*3))+Math.random()*TAU;
  const dur=4500,t0=performance.now();
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
    drawRot=start+(target-start)*e;
    const cv=document.getElementById('drawWheel');if(cv)paintWheel(cv,pool,drawRot);
    if(p<1){requestAnimationFrame(step);return;}
    drawRot=((target%TAU)+TAU)%TAU;
    const idx=drawWinnerIndex(pool.length,drawRot);
    const win=pool.splice(idx,1)[0];
    drawState.results.push(win);drawSpinning=false;saveDraw();
    toast(LANG==='ko'?`${drawState.results.length}등 — ${win}`:`#${drawState.results.length} — ${win}`);
    renderDraw();
  };
  requestAnimationFrame(step);
}
function renderDraw(){
  const s=document.getElementById('sec-draw');if(!s)return;
  const pool=drawPool(),res=drawState.results;
  s.innerHTML=`<div class="panel"><h2>${T('추첨')} <span class="sub">${T('길드원 명단에서 불러와 돌림판으로 순서를 정합니다')}</span></h2>
    <div class="pflex">
      <div class="pleft">
        <div class="search" style="margin-bottom:10px">
          <button class="btn primary" id="drawSpin">🎯 ${T('돌리기')}</button>
          <button class="btn" id="drawReset">↺ ${T('처음부터')}</button>
          ${LOC_STATES.map(g=>{const cnt=(cur().notice.roster||[]).filter(r=>r[0]&&normLoc(r[5])===g).length;
            return `<label class="hint" style="display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" class="drawLoc" data-loc="${g}" style="width:auto;margin:0"${drawState.locs[g]!==false?' checked':''}${drawSpinning?' disabled':''}> ${TV(g)} ${cnt}</label>`;}).join('')}
          <span class="hint">${T('남은 인원')} <b style="color:var(--cyan)">${pool.length}</b>${LANG==='ko'?'명':''}</span>
        </div>
        <div class="wheelwrap"><canvas id="drawWheel"></canvas></div>
        <h2 style="margin-top:16px">${T('참가자')} <span class="sub">${pool.length}${LANG==='ko'?'명':''} · ${T('× = 이번 추첨에서 빼기 · 노란색 = 직접 추가')}</span></h2>
        <div class="search" style="margin-bottom:10px">
          <input id="drawAddInp" maxlength="20" placeholder="${T('추가할 이름')}"${drawSpinning?' disabled':''}>
          <button class="btn" id="drawAddBtn"${drawSpinning?' disabled':''}>${T('+ 추가')}</button>
          <button class="btn" id="drawRestore"${drawSpinning||!(drawState.added.length||drawState.removed.length)?' disabled':''}>↻ ${T('길드원 명단으로 되돌리기')}</button>
        </div>
        <div class="chips" id="drawChips" style="max-height:220px;overflow:auto">${pool.map((n,i)=>
          `<span class="chip${drawState.added.includes(n)?' main':''}">${escapeHTML(n)}${drawSpinning?'':`<span class="del" data-i="${i}" title="${T('빼기')}">×</span>`}</span>`).join('')||`<span class="note">${T('참가자가 없습니다')}</span>`}</div>
      </div>
      <div class="pright">
        <h2>${T('추첨 결과')} <span class="sub">${res.length}${LANG==='ko'?'명':''}</span><span class="right"><button class="btn" id="drawShot">${T('📷 캡처 화면')}</button></span></h2>
        ${res.length?'<ol class="drawres">'+res.map((nm,i)=>`<li><span class="rank ${i<3?'r'+(i+1):''}">${i+1}</span>${escapeHTML(nm)}</li>`).join('')+'</ol>'
          :`<div class="note">${T('아직 추첨하지 않았습니다')}</div>`}
      </div>
    </div>
    <div class="note">${T('돌림판이 멈췄을 때 위쪽 화살표가 가리키는 이름이 다음 등수가 되고, 뽑힌 이름은 돌림판에서 빠집니다 · 결과는 이 브라우저에만 저장됩니다')}</div></div>`;
  paintWheel(document.getElementById('drawWheel'),pool,drawRot);
  const sp=document.getElementById('drawSpin');sp.disabled=drawSpinning||!pool.length;sp.onclick=spinWheel;
  const rs=document.getElementById('drawReset');rs.disabled=drawSpinning;
  rs.onclick=()=>{
    if(drawSpinning)return;
    if(drawState.results.length&&!confirm(T('처음부터 다시 추첨할까요? 지금까지의 결과가 지워집니다.')))return;
    drawState.results=[];drawState.pool=drawCandidates();drawRot=0;saveDraw();renderDraw();
  };
  // 위치(내근·외근)별 참가 포함/제외 — 이미 뽑힌 사람은 다시 들어가지 않음
  document.querySelectorAll('#sec-draw .drawLoc').forEach(cb=>cb.onchange=()=>{
    if(drawSpinning)return;
    drawState.locs[cb.dataset.loc]=cb.checked;
    drawState.pool=drawCandidates().filter(n=>!drawState.results.includes(n));
    saveDraw();renderDraw();
  });
  // 참가자 추가·빼기·되돌리기
  const inp=document.getElementById('drawAddInp');
  const doAdd=()=>{if(addDrawName(inp.value)){renderDraw();const n=document.getElementById('drawAddInp');if(n)n.focus();}};
  document.getElementById('drawAddBtn').onclick=doAdd;
  inp.onkeydown=e=>{if(e.key==='Enter')doAdd();};
  document.querySelectorAll('#drawChips .del').forEach(d=>d.onclick=()=>{removeDrawName(pool[+d.dataset.i]);renderDraw();});
  document.getElementById('drawRestore').onclick=()=>{
    if(drawSpinning)return;
    if(!confirm(T('직접 추가하거나 뺀 참가자를 모두 되돌리고 길드원 명단으로 다시 불러올까요? (추첨 결과는 유지)')))return;
    drawState.added=[];drawState.removed=[];
    drawState.pool=drawCandidates().filter(n=>!drawState.results.includes(n));
    saveDraw();renderDraw();
  };
  document.getElementById('drawShot').onclick=()=>{
    const r=renderDrawCanvas();
    if(!r){toast(T('추첨 결과가 없습니다'));return;}
    showCaptureModal(r,`${T('추첨 결과')} ${LANG==='ko'?'캡처':'Capture'}`,T('추첨 결과'));
  };
}
// 추첨 결과를 캡처용 이미지로 (15명 단위로 열을 나눔)
function renderDrawCanvas(){
  const res=drawState.results;if(!res.length)return null;
  const PER=15,nCol=Math.ceil(res.length/PER),rowsN=Math.min(res.length,PER);
  const PAD=26,CH=38,HEAD=62,RW=64,NW=170,colW=RW+NW,GAP=16;
  const FT=(s,b)=>`${b?'700 ':''}${s}px "Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif`;
  const cv=document.createElement('canvas'),x=cv.getContext('2d');
  const d=new Date(),p2=n=>String(n).padStart(2,'0');
  const title=T('추첨 결과');
  const meta=`${cur().guildName||''} · ${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())} · ${res.length}${LANG==='ko'?'명':''}`;
  // 제목과 오른쪽 정보가 겹치지 않도록 글자 폭을 재서 이미지 폭을 정함
  x.font=FT(23,1);const titleW=x.measureText(title).width;x.font=FT(13);const metaW=x.measureText(meta).width;
  const tablesW=nCol*colW+(nCol-1)*GAP;
  const W=Math.ceil(PAD*2+Math.max(tablesW,titleW+32+metaW)),H=HEAD+CH*(1+rowsN)+PAD+24;
  const X0=(W-tablesW)/2;
  const S=2;cv.width=W*S;cv.height=H*S;x.scale(S,S);
  x.fillStyle='#0C1220';x.fillRect(0,0,W,H);
  ['#3B82F6','#A855F7','#EF4444'].forEach((c,i)=>{x.fillStyle=c;x.fillRect(W/3*i,0,W/3,5);});
  x.textBaseline='alphabetic';x.fillStyle='#FFFFFF';x.font=FT(23,1);x.textAlign='left';
  x.fillText(title,PAD,HEAD-20);
  x.fillStyle='#8FA6C4';x.font=FT(13);x.textAlign='right';
  x.fillText(meta,W-PAD,HEAD-22);
  const cell=(t,cx,cy,cw,bg,fg,bold)=>{
    x.fillStyle=bg;x.fillRect(cx,cy,cw,CH);x.strokeStyle='#35507A';x.lineWidth=1;x.strokeRect(cx,cy,cw,CH);
    x.fillStyle=fg;x.font=FT(15,bold);x.textAlign='center';x.textBaseline='middle';x.fillText(t,cx+cw/2,cy+CH/2,cw-12);
  };
  const MEDAL=['#FFD166','#C7D2E4','#C98A5B'];
  for(let ci=0;ci<nCol;ci++){
    const cx=X0+ci*(colW+GAP);
    cell(T('등수'),cx,HEAD,RW,'#1D3A5C','#CFE6FF',1);
    cell(T('이름'),cx+RW,HEAD,NW,'#1D3A5C','#CFE6FF',1);
    for(let r=0;r<PER;r++){
      const i=ci*PER+r;if(i>=res.length)break;
      const cy=HEAD+CH*(r+1),bg=r%2?'#0E1728':'#111A2C';
      cell(String(i+1),cx,cy,RW,bg,i<3?MEDAL[i]:'#EAF2FF',i<3);
      cell(res[i],cx+RW,cy,NW,bg,'#EAF2FF',i<3);
    }
  }
  x.fillStyle='#5A6E8C';x.font=FT(11);x.textAlign='left';x.textBaseline='alphabetic';
  x.fillText('RF ONLINE NEXT',PAD,H-12);
  return {canvas:cv,w:W,h:H};
}

    <div class="step"><b>1</b><div>Apps Script 편집기 → 우측 상단 <b>배포</b> → <b>배포 관리</b> (※ “새 배포” 아님)</div></div>
    <div class="step"><b>2</b><div>연필(수정) 아이콘 클릭 → 버전에서 <b>새 버전</b> 선택</div></div>
    <div class="step"><b>3</b><div><b>배포</b> 클릭 → 브라우저에서 <span class="kbd">Ctrl+F5</span>로 새로고침</div></div>

    <h3>9. 백업과 복구</h3>
    <ul>
      <li><b>정기 백업</b> — 구글 시트에서 파일 → 사본 만들기. 큰 변경 전에는 꼭 하세요.</li>
      <li><b>수동 백업</b> — 포털 맨 아래 <b>변경사항 내보내기(JSON)</b> 버튼으로 파일 저장, <b>가져오기</b>로 복원.</li>
      <li><b>초기화</b> — 수정 모드 하단 <b>스냅샷으로 초기화</b>는 초기 데이터로 되돌립니다. 저장해야 시트에 반영되니 신중히 사용하세요.</li>
      <li>시트의 <b>WEB_DATA</b> 탭에는 전체 데이터가 JSON으로 보관됩니다. 직접 편집하지 마세요.</li>
    </ul>

    <h3>10. 문제 해결</h3>
    <table><thead><tr><th>증상</th><th>조치</th></tr></thead><tbody>
      <tr><td>비밀번호가 안 먹힘</td><td>재배포(새 버전) 했는지 확인. Code.gs와 화면 파일을 함께 교체했는지 확인</td></tr>
      <tr><td>저장 실패 · 인증 만료</td><td>수정 모드를 껐다 다시 켜고 저장 (토큰 12시간)</td></tr>
      <tr><td>변경이 화면에 안 보임</td><td><span class="kbd">Ctrl+F5</span> 강제 새로고침</td></tr>
      <tr><td>드롭다운에 새 장비가 없음</td><td>시트 [드랍다운리스트] 탭에 추가 후 새로고침</td></tr>
      <tr><td>인원이 탭에 안 보임</td><td>공지 탭 길드원 명단에 등록되어 있는지 확인</td></tr>
    </tbody></table>
  </div>`;
}

function renderStats(){
  const powers=cur().basic.map(b=>b.power).filter(p=>p);
  const items=[["캐릭터",cur().basic.length]];
  if(showPower()){
    items.push(["평균 전투력",powers.length?Math.round(powers.reduce((a,b)=>a+b,0)/powers.length).toLocaleString():'—']);
    items.push(["최고 전투력",powers.length?Math.max(...powers).toLocaleString():'—']);
  }
  items.push(["길드원 명단",cur().notice.roster.length]);
  items.push(["본캐 / 부캐",cur().notice.roster.filter(r=>r[4]!=='부캐').length+' / '+cur().notice.roster.filter(r=>r[4]==='부캐').length]);
  document.getElementById('statStrip').innerHTML=items.map(([l,v])=>`<div class="stat"><div class="v">${v}</div><div class="l">${T(l)}</div></div>`).join('');
}

/* ===== 헤더 고정: 화면 상단에 떠서 따라오는 헤더 ===== */
const floats=[];
const headerH=()=>{const h=document.querySelector('header');return h?h.offsetHeight:0;};

function colVars(w){ // 좌측 고정 열 오프셋 계산
  const tr=w.querySelector('thead tr');if(!tr)return;
  const c=tr.children;
  if(c[0])w.style.setProperty('--c1',c[0].offsetWidth+'px');
  if(c[0]&&c[1])w.style.setProperty('--c2',(c[0].offsetWidth+c[1].offsetWidth)+'px');
}

function clearFloats(){floats.forEach(f=>f.el.remove());floats.length=0;}

function attachFloat(wrap){
  const table=wrap.querySelector('table');if(!table)return;
  const thead=table.querySelector('thead');if(!thead)return;
  const el=document.createElement('div');el.className='floathdr';
  const inn=document.createElement('div');inn.className='floathdr-in'+(wrap.classList.contains('frz')?' frz':'');
  const t2=document.createElement('table');
  t2.appendChild(thead.cloneNode(true));
  inn.appendChild(t2);el.appendChild(inn);document.body.appendChild(el);
  const rec={el,inn,t2,wrap,table,thead};
  // 원본 헤더 클릭과 연동 (정렬)
  [...t2.querySelectorAll('th')].forEach((th,i)=>{
    th.onclick=()=>{const o=thead.querySelectorAll('th')[i];if(o)o.click();};
  });
  // 가로 스크롤 동기화 (양방향)
  wrap.addEventListener('scroll',()=>{inn.scrollLeft=wrap.scrollLeft;});
  inn.addEventListener('scroll',()=>{if(Math.abs(inn.scrollLeft-wrap.scrollLeft)>1)wrap.scrollLeft=inn.scrollLeft;});
  floats.push(rec);
  sizeFloat(rec);
  return rec;
}

function sizeFloat(r){
  const ths=[...r.thead.querySelectorAll('th')],ths2=[...r.t2.querySelectorAll('th')];
  r.t2.style.width=r.table.offsetWidth+'px';
  ths.forEach((th,i)=>{if(ths2[i]){const w=th.offsetWidth+'px';ths2[i].style.width=w;ths2[i].style.minWidth=w;}});
  r.inn.style.setProperty('--c1',getComputedStyle(r.wrap).getPropertyValue('--c1'));
  r.inn.style.setProperty('--c2',getComputedStyle(r.wrap).getPropertyValue('--c2'));
  r.el.style.height=(r.thead.offsetHeight||34)+'px';
  r.inn.style.height=(r.thead.offsetHeight+20||54)+'px';
}

function positionFloats(){
  const top=headerH();
  floats.forEach(r=>{
    const wr=r.wrap.getBoundingClientRect();
    const hh=r.thead.offsetHeight||34;
    const on=wr.top<top && wr.bottom>top+hh+10;
    if(!on){r.el.style.display='none';return;}
    r.el.style.display='block';
    r.el.style.top=top+'px';
    r.el.style.left=wr.left+'px';
    r.el.style.width=r.wrap.clientWidth+'px';
    r.inn.scrollLeft=r.wrap.scrollLeft;
  });
}

function refreshFloats(){
  clearFloats();
  document.querySelectorAll('main section.on .tblwrap.frz').forEach(w=>{colVars(w);attachFloat(w);});
  positionFloats();
}
function syncStick(){ // 렌더 후 호출
  document.querySelectorAll('.tblwrap.frz').forEach(colVars);
  requestAnimationFrame(refreshFloats);
}
addEventListener('scroll',positionFloats,{passive:true});
addEventListener('resize',()=>{floats.forEach(sizeFloat);positionFloats();});

/* ===== init ===== */
async function bootLoad(){
  const dot=document.getElementById('srcDot'),txt=document.getElementById('srcTxt');
  if(!SYNC_URL){srcState='시트 연결 대기';txt.textContent=T(srcState);renderAll();return;}
  srcState='시트에서 불러오는 중…';txt.textContent=T(srcState);
  try{
    const r=await fetch(SYNC_URL+'?api=1',{signal:AbortSignal.timeout(15000)});
    const j=await r.json();
    if(j&&j.ok){
      if(j.dd)SERVER_DD=j.dd;
      if(j.data&&j.data.basic){
        D=migrate(j.data);
        dot.classList.add('live');srcState='실시간 · 시트 동기화';txt.textContent=T(srcState);
        renderAll();return;
      }
    }
    srcState='시트에 저장된 데이터 없음';txt.textContent=T(srcState);
  }catch(e){
    srcState='서버 연결 실패 — SYNC_URL 확인 필요';txt.textContent=T(srcState);
  }
  renderAll();
}
bootLoad();
